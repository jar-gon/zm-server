http:
  port: 3000

database:
  uri: 'mongodb://127.0.0.1:27017/zm-web'

API_PREFIX: 'api'

session:
  resave: false
  saveUninitialized: false
  name: 'zm.session'
  rolling: true

# 86400000 = 24 * 60 * 60 * 1000  使用数字格式，否则会出现格式类型错误
cookie:
  httpOnly: true
  secure: true
  sameSite: 'lax'
  maxAge: 86400000

jwt:
  expiresIn: '1h'

captcha:
  ttlMs: 300000
  size: 4
  fontSize: 50
  width: 100
  height: 34
  background: '#c96'

swagger:
  title: 'nest接口文档'
  path: '/api-docs'
